name: Preview

# Publishes a playable copy of the game on GitHub Pages:
#   main:          https://shutfordite.github.io/gresca/  (redirects to /main/<commit>/)
#   pull request:  https://shutfordite.github.io/gresca/pr/<number>/<commit>/  (pr/<number>/ redirects to the newest)
# and keeps one comment on each pull request with its link. The preview is removed when the pull request closes.
# Pages must be set to "Deploy from a branch", branch gh-pages, folder / (Settings → Pages).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: write       # push to gh-pages
  pull-requests: write  # the preview comment

# One deploy at a time, so pushes to gh-pages never race. Queued deploys all run (none are cancelled).
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Pull requests from forks get a read-only token, so they get no preview.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          path: game # for a pull request this is the merge with main, the same code the tests run on

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Update the site
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # What gets published: the page and every folder it loads files from. Add new runtime folders here.
          SITE: index.html lab.html src art styles maps assets vendor
          KEEP: 3 # builds kept per pull request (and for main), so a tab left open on an older build keeps working
        run: |
          set -euo pipefail
          short=${SHA::7}
          if [ "$EVENT" = push ]; then
            base=site/main; top=site; what="main at $short"
          else
            base="site/pr/$PR"; top="$base"; what="PR #$PR at $short"
          fi
          if [ "$ACTION" = closed ]; then
            rm -rf "$base"; what="remove preview for PR #$PR"
          else
            # Each commit gets its own folder, so the browser cache (Pages sends max-age=600) can never mix
            # files from two builds. The link in the PR comment points straight at this folder.
            build="$base/$short"
            rm -rf "$build"; mkdir -p "$build"
            for f in $SITE; do if [ -e "game/$f" ]; then cp -R "game/$f" "$build/"; fi; done
            # Keep the newest $KEEP builds; builds.txt lists them oldest first.
            list="$base/builds.txt"; touch "$list"
            grep -vx "$short" "$list" > "$list.tmp" || true; echo "$short" >> "$list.tmp"; mv "$list.tmp" "$list"
            while [ "$(wc -l < "$list")" -gt "$KEEP" ]; do old=$(head -n1 "$list"); rm -rf "${base:?}/$old"; sed -i 1d "$list"; done
            # The stable address (pr/N/ or the site root) redirects to the newest build.
            rel=${build#"$top"/}
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./%s/"><title>Gresca</title><a href="./%s/">Open the latest build</a>\n' "$rel" "$rel" > "$top/index.html"
          fi
          touch site/.nojekyll
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to publish'; exit 0; fi
          git commit -q -m "Preview: $what"
          git push -q origin gh-pages

      - name: Comment with the link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- gresca-preview -->';
            const pr = context.payload.pull_request;
            const base = `https://${context.repo.owner}.github.io/${context.repo.repo}`;
            const sha = process.env.SHA.slice(0, 7);
            const body = context.payload.action === 'closed'
              ? `${marker}\nPreview removed now that this pull request is closed. The current game on main: ${base}/`
              : `${marker}\n**▶ Play this version:**\n` +
                `- Play mountain (the default map): ${base}/pr/${pr.number}/${sha}/\n` +
                `- Test slope (the older, gentler run): ${base}/pr/${pr.number}/${sha}/?map=test\n\n` +
                `Built from ${sha}, merged with main as CI tests it. Updates on every push. ` +
                `Each push gets its own address, so you never get a cached older build. Allow a minute after this comment changes for Pages to publish. ${base}/pr/${pr.number}/ always redirects to the newest build.`;
            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
