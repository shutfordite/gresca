<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gresca</title>
<style>
:root{--bg:#0e1a2b;--ink:#f3f5fb;--acc:#f2b52a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
body{position:relative}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;font-size:13px;line-height:1.2;text-shadow:0 1px 4px rgba(30,34,64,.7);pointer-events:none}
.hud b{display:block;font-size:26px;letter-spacing:.5px}
#pop{position:absolute;left:60%;top:56%;font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 5px rgba(30,34,64,.8);opacity:0;pointer-events:none}
#mini{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:42px;height:103px;border-radius:6px;border:2px solid rgba(255,255,255,.35);overflow:hidden;opacity:.8;pointer-events:none}
#mini canvas{width:100%;height:100%;display:block}
#dot{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);border:1px solid #fff}
.glove{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:18px;width:46px;height:54px;color:#fff;opacity:.3;pointer-events:none;transition:opacity .08s}
.glove.r{left:auto;right:18px;transform:scaleX(-1)}
.glove.on{opacity:.85}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(24,30,58,.78);padding:20px;text-align:center}
#msg div{max-width:340px}
h1{margin:0 0 6px;font-size:34px;letter-spacing:.5px}
p{margin:6px 0;line-height:1.4;font-size:15px}
small{opacity:.7;font-size:12px}
#go{margin-top:12px;padding:13px 28px;border:0;border-radius:12px;background:var(--acc);color:#1b2038;font:700 17px "Trebuchet MS",system-ui,sans-serif}
.pick{display:flex;margin:14px auto 0;max-width:260px}
.pick button{flex:1;padding:11px 0;border:2px solid var(--acc);background:transparent;color:var(--ink);font:700 15px "Trebuchet MS",system-ui,sans-serif}
.pick button:first-child{border-radius:12px 0 0 12px}
.pick button:last-child{border-radius:0 12px 12px 0;border-left:0}
.pick button.on{background:var(--acc);color:#1b2038}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><b id="score">0</b><span id="info">0 km/h</span></div>
<div id="pop"></div>
<div id="mini"><canvas id="mc" width="42" height="103"></canvas><div id="dot"></div></div>
<svg class="glove" id="gl" viewBox="0 0 40 48" aria-hidden="true"><path fill="currentColor" d="M8 46V24L4 15c-1-3 2-5 4-3l4 5V5c0-3 5-3 5 0v12V3c0-3 5-3 5 0v14V7c0-3 5-3 5 0v20c0 9-2 14-5 19z"/></svg>
<svg class="glove r" id="gr" viewBox="0 0 40 48" aria-hidden="true"><path fill="currentColor" d="M8 46V24L4 15c-1-3 2-5 4-3l4 5V5c0-3 5-3 5 0v12V3c0-3 5-3 5 0v14V7c0-3 5-3 5 0v20c0 9-2 14-5 19z"/></svg>
<div id="msg"><div><h1>Gresca</h1><p id="t">Building the mountain...</p><div class="pick" role="group" aria-label="Equipment"><button id="pb" class="on" aria-pressed="true">Snowboard</button><button id="ps" aria-pressed="false">Skis</button></div><button id="go" hidden>Drop in</button><p><small>Stylized terrain inspired by the Encampadors to Pas de la Casa run. Real elevation data comes next.</small></p></div></div>
<script>
const W0=1000,H0=2450,FIN=2330;
// Terrain park. Kickers launch fast riders; KBIG ones have taller ramps and give more air.
const KICK=[260,340,400,760,840,920,1060,1250,1400,1560,1680,1850,1990,2150];
const KBIG=new Set([400,920,1250,1680,2150]);
// Rails and boxes: [start y, length, offset from the piste centreline, type]. They sit between the kickers.
const RAIL_DEF=[[285,20,-9,'rail'],[355,18,9,'box'],[775,22,-9,'rail'],[855,18,9,'box'],[940,24,-9,'rail'],[1080,16,9,'box'],[1125,22,-9,'rail'],[1275,20,9,'rail'],[1420,24,-9,'box'],[1590,20,9,'rail'],[1700,22,-9,'rail'],[1880,18,9,'box'],[2020,24,-9,'rail']];
const cx=y=>500+170*Math.sin(y/350)+70*Math.sin(y/130+1);
// A rail is a straight chord that follows the piste: x0,y0 to its end, with unit direction dx,dy and length len.
const RAILS=RAIL_DEF.map(([ya,n,off,t])=>{const yb=ya+n,x0=cx(ya)+off,x1=cx(yb)+off,len=Math.hypot(x1-x0,yb-ya);
 return{y0:ya,y1:yb,x0,x1,len,dx:(x1-x0)/len,dy:(yb-ya)/len,h:t==='box'?.55:.75,t}});
// Kicker ramp: a curved rise up to the lip, then a short drop. Extra height in metres at (px,py).
function bump(px,py){let h=0;
 for(const k of KICK){if(py<k-11||py>k+4)continue;const d=Math.abs(px-cx(py));if(d>10)continue;
  const hk=KBIG.has(k)?2.2:1.3,u=py<k?Math.pow((py-(k-11))/11,1.5):1-(py-k)/4,w=d<7?1:1-(d-7)/3;h+=hk*u*w}
 return h}
const hash=(i,j)=>{const n=Math.sin(i*127.1+j*311.7)*43758.5453;return n-Math.floor(n)};
function vn(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
return hash(i,j)*(1-u)*(1-v)+hash(i+1,j)*u*(1-v)+hash(i,j+1)*(1-u)*v+hash(i+1,j+1)*u*v}
const fbm=(x,y)=>vn(x/90,y/90)*.55+vn(x/40,y/40)*.3+vn(x/17,y/17)*.15;
const H=new Float32Array(W0*H0),M=new Uint8Array(W0*H0),trees=new Map(),treeArr=[];
const map=document.createElement('canvas');map.width=W0;map.height=H0;
const mx=map.getContext('2d');
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const msg=$('msg'),msgT=$('t'),go=$('go'),scoreEl=$('score'),info=$('info'),pop=$('pop'),dot=$('dot'),gl=$('gl'),gr=$('gr'),pb=$('pb'),ps=$('ps');
let W,Hh;
function resize(){const d=Math.min(2,devicePixelRatio||1);cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;W=cv.width;Hh=cv.height}
addEventListener('resize',resize);resize();

// Camera: behind and well above the rider, looking steeply down the slope.
const FOV=1.15,NS=152,CAMBACK=10,CAMH=7.6,HZ=.14,RSC=.55,FOG=[214,220,238];
// cam.s is the slope ahead (metres dropped per metre); the view tilts down by it so the snow fills the screen.
const cam={px:0,py:0,dx:0,dy:1,RW:1,RH:1,kx:1,sc:1,hz:0,s:.26,pt:0};
let col,col0;

function build(){
 for(let y=0;y<H0;y++){const c=cx(y);for(let x=0;x<W0;x++){const d=Math.abs(x-c),t=Math.max(0,Math.min(1,(d-18)/16)),m=1-t*t*(3-2*t),i=y*W0+x;
  M[i]=m*255;H[i]=2700-y*.26+(fbm(x,y)-.5)*110*(1-m*.92)+Math.min(d,260)*.16}}
 // kicker ramps are real terrain, so they show up in the shading and in the 3D view
 for(const k of KICK)for(let yy=k-11;yy<=k+4;yy++){const c=Math.round(cx(yy));for(let xx=c-11;xx<=c+11;xx++)H[yy*W0+xx]+=bump(xx,yy)}
 // Colour map: lavender shadows, warm lit snow, grey rock, and fine corduroy stripes on the groomed piste.
 const img=mx.createImageData(W0,H0),D=img.data;
 for(let y=0;y<H0;y++){const c=cx(y);for(let x=0;x<W0;x++){const i=y*W0+x;let gx=0,gy=0;
  if(x>0&&x<W0-1&&y>0&&y<H0-1){gx=(H[i+1]-H[i-1])/2;gy=(H[i+W0]-H[i-W0])/2}
  const sl=Math.hypot(gx,gy),sh=Math.max(.55,Math.min(1.12,.86-(gx+gy)*.22)),lit=Math.max(0,Math.min(1,(sh-.55)/.5)),m=M[i]/255,rk=Math.max(0,Math.min(1,(sl-.5)*4))*(1-m);
  let r=170+lit*74+m*6,g=168+lit*78+m*6,b=214+lit*38+m*4;
  if(m>0){const st=1+.045*m*Math.sin((x-c)*2.1);r*=st;g*=st;b*=st}
  r+=(118-r)*rk;g+=(120-g)*rk;b+=(130-b)*rk;
  const o=i*4;D[o]=r;D[o+1]=g;D[o+2]=b;D[o+3]=255}}
 mx.putImageData(img,0,0);
 // lift line
 mx.strokeStyle='#39424f';mx.lineWidth=1.2;mx.beginPath();mx.moveTo(820,2290);mx.lineTo(820,140);mx.stroke();
 for(let y=140;y<=2290;y+=70){mx.fillStyle='#39424f';mx.fillRect(818,y-2,5,5)}
 for(let y=200;y<2290;y+=420){mx.fillStyle='#ff6b3d';mx.fillRect(817,y,6,4)}
 // trees, each with a long soft shadow
 for(let gy=0;gy<H0/6;gy++)for(let gx=0;gx<W0/6;gx++){
  const x=gx*6+hash(gx,gy)*6,y=gy*6+hash(gy,gx+9)*6,i=(y|0)*W0+(x|0);
  if(y<20||y>FIN-10||x<10||x>W0-10||Math.abs(x-820)<10||M[i]>0||Math.abs(x-cx(y))<40||H[i]>2560)continue;
  if(vn(x/60,y/60)<.42||hash(gx+5,gy+3)<.35)continue;
  const T={x,y};trees.set(gx*10000+gy,T);treeArr.push(T);
  mx.fillStyle='rgba(96,86,150,.30)';mx.beginPath();mx.moveTo(x-1.4,y);mx.lineTo(x+1.4,y);mx.lineTo(x+9,y-10);mx.closePath();mx.fill();
  mx.fillStyle='#1f4a3a';mx.beginPath();mx.arc(x,y,1.6,0,7);mx.fill()}
 // kickers: a bluish pad up the ramp, then a pale lip with an orange edge (stronger for the big ones). Painted row by row so it follows the curve of the piste.
 for(const k of KICK){const big=KBIG.has(k),w=big?10:9;
  for(let yy=k-11;yy<k+5;yy++){const c=cx(yy);
   mx.fillStyle=yy<k?(big?'rgba(110,124,196,.45)':'rgba(120,134,196,.34)'):(big?'#b7c6dd':'#9fb0c8');mx.fillRect(c-w,yy,w*2,1);
   if(yy===k){mx.fillStyle='#ff6b3d';mx.fillRect(c-w,yy,w*2,1.3)}}}
 for(const r of RAILS){mx.strokeStyle='rgba(96,86,150,.35)';mx.lineWidth=1.4;mx.beginPath();mx.moveTo(r.x0+1.2,r.y0-.8);mx.lineTo(r.x0+r.dx*r.len+1.2,r.y0+r.dy*r.len-.8);mx.stroke()}
 // village and finish
 for(let k=0;k<26;k++){const x=cx(FIN+60)-230+hash(k,1)*460,y=FIN+40+hash(k,2)*70,w=12+hash(k,3)*8;
  mx.fillStyle='rgba(30,40,60,.3)';mx.fillRect(x+2,y+2,w,10);mx.fillStyle=hash(k,4)>.5?'#b5543a':'#8a6a5a';mx.fillRect(x,y,w,10);mx.fillStyle='#f2f6fa';mx.fillRect(x,y,w,3)}
 const fc=cx(FIN);for(let k=0;k<16;k++){mx.fillStyle=k%2?'#fff':'#d33';mx.fillRect(fc-40+k*5,FIN,5,3)}
 mx.fillStyle='#d33';mx.fillRect(fc-42,FIN-8,3,11);mx.fillRect(fc+39,FIN-8,3,11);
 mx.fillStyle='#16202e';mx.font='bold 13px Trebuchet MS,sans-serif';mx.textAlign='center';mx.fillText('PAS DE LA CASA',fc,FIN+30);
 col=mx.getImageData(0,0,W0,H0).data;col0=col.slice();
 $('mc').getContext('2d').drawImage(map,0,0,W0,H0,0,0,42,103);
}

// ---- state ----
// `a` is the direction the board points. The board is twin tip, so riding or landing with it
// pointing backwards (switch) is just as good as forwards; `rot` counts the spin in the air.
let L=0,R=0,B=0,JU=0,state='load',x,y,vx,vy,a,crash,crashes,time,spin,camA=1.57,camH=0,jz=0,jv=0,airT=0,kick=false,score=0,popT=0,popTxt='',rot=0,both=false,grind=null,grindD=0,rig='board';
const TAU=Math.PI*2;
// Equipment. Both are twin tip. Skis carve a little quicker and grip better; the board spins a little slower.
const RIGS={board:{turn:1,grip:5,spin:7},ski:{turn:1.12,grip:6.5,spin:8}};
const parts=[],MAXP=160;
function emit(n,px_,py_,pz,spread,up,dvx,dvy){for(let k=0;k<n&&parts.length<MAXP;k++)parts.push({x:px_,y:py_,z:pz,vx:dvx+(Math.random()-.5)*spread,vy:dvy+(Math.random()-.5)*spread,vz:up*(.4+Math.random()*.6),t:0,life:.45+Math.random()*.4})}
function stepParts(dt){for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=6*dt;p.vx*=.96;p.vy*=.96;if(p.t>p.life||p.z<-.2)parts.splice(k,1)}}

function start(){x=cx(60);y=60;vx=0;vy=2;a=Math.PI/2;crash=0;crashes=0;time=0;spin=0;score=0;popT=0;airT=0;kick=false;parts.length=0;jz=jv=JU=0;rot=0;both=false;grind=null;grindD=0;
 col.set(col0);camA=1.57;cam.s=.26;camH=H[60*W0+(x|0)]+CAMH+cam.s*CAMBACK;state='run';msg.hidden=true}

function jumpStep(dt){
 if(crash>0){jz=0;jv=0;airT=0;return}
 const s=Math.hypot(vx,vy);
 if(jz>0)JU=0;
 if(jz<=0&&jv<=0){
  if(JU){jz=.01;jv=6.5;JU=0;airT=0;rot=0;kick=false}
  else{const kk=Math.abs(x-cx(y))<9&&s>4?KICK.find(k=>y>=k&&y<k+5):undefined;
   if(kk!==undefined){jz=.01;jv=(2.5+s*.3)*(KBIG.has(kk)?1.35:1);airT=0;rot=0;kick=true}}}
 if(jz>0||jv>0){airT+=dt;jv-=15*dt;jz+=jv*dt;
  if(jz<=0){const land=jv;jz=0;jv=0;
   emit(12,x,y,.1,3,2.5,vx*.3,vy*.3);
   // twin tip: the board only has to line up with the direction of travel, nose first or tail first
   const dv=Math.atan2(vy,vx)-a,ax=((dv%Math.PI)+Math.PI)%Math.PI,mis=Math.min(ax,Math.PI-ax),rt=Math.round(Math.abs(rot)/Math.PI)*180;
   if(Math.hypot(vx,vy)>3&&land<-8&&mis>.6){crash=1.1;crashes++;vx=vy=0;airT=0}
   else if(airT>.35){const pts=Math.round(airT*60+(kick?20:0)+rt/180*40);score+=pts;popTxt='+'+pts+'p '+(rt?rt+' ':'')+'Air';popT=1.6}}}
}

// ---- rails and boxes ----
// Ride onto one on the snow, or drop onto it from the air, roughly along its length (nose or tail first).
function railCheck(){
 if(grind||crash>0||jv>0)return;
 const s=Math.hypot(vx,vy);if(s<3)return;
 for(const r of RAILS){
  if(y<r.y0-1||y>r.y1||jz>r.h+.6)continue;
  const ox=x-r.x0,oy=y-r.y0,t=ox*r.dx+oy*r.dy,perp=Math.abs(-ox*r.dy+oy*r.dx);
  if(t<-1||t>r.len-4||perp>1.5)continue;
  const phi=Math.atan2(r.dy,r.dx),wd=d=>Math.abs(Math.atan2(Math.sin(d),Math.cos(d))),bd=((a-phi)%Math.PI+Math.PI)%Math.PI;
  if(wd(Math.atan2(vy,vx)-phi)>.6||Math.min(bd,Math.PI-bd)>.6)continue;
  grind={r,t:Math.max(0,t)};grindD=0;jz=r.h;jv=0;airT=0;JU=0;emit(8,x,y,r.h,2.5,2,vx*.1,vy*.1);return}
}
function grindStep(dt){
 const r=grind.r,spd=Math.max(3,Math.hypot(vx,vy)*(1-.12*dt));
 grind.t+=spd*dt;grindD+=spd*dt;
 const t=Math.min(grind.t,r.len);
 x=r.x0+r.dx*t;y=r.y0+r.dy*t;vx=r.dx*spd;vy=r.dy*spd;jz=r.h;jv=0;
 const phi=Math.atan2(r.dy,r.dx),tgt=Math.cos(a-phi)>=0?phi:phi+Math.PI;
 a+=Math.atan2(Math.sin(tgt-a),Math.cos(tgt-a))*Math.min(1,dt*10);
 if(Math.random()<.7)emit(1,x,y,r.h,1.2,1.2,0,0);
 if(JU)endGrind(true);else if(grind.t>=r.len)endGrind(false)}
function endGrind(jump){const r=grind.r,pts=Math.round(grindD*3);
 score+=pts;popTxt='+'+pts+'p '+(r.t==='box'?'Box':'Rail');popT=1.6;
 grind=null;grindD=0;jz=r.h;jv=jump?6.5:2.5;JU=0;airT=jump?0:-.6;rot=0;kick=false}

const TQ=[0,4,W0*4,W0*4+4];
function step(dt){
 time+=dt;
 if(grind){grindStep(dt);return}
 const s=Math.hypot(vx,vy);let slip=0;
 if(crash>0){crash-=dt;spin+=dt*14}
 else if(jz>.05){spin=0;const da=((R?1:0)-(L?1:0))*dt*RIGS[rig].spin;a+=da;rot+=da} // in the air, left and right spin the board
 else{spin=0;a+=((R?1:0)-(L?1:0))*dt*(2.7-Math.min(s,30)*.045)*RIGS[rig].turn;a=((a%TAU)+TAU)%TAU;
  const bs=a>=Math.PI?Math.PI:0;a=bs+Math.max(.15,Math.min(Math.PI-.15,a-bs))} // on the snow, carve within forward or switch
 const i=(y|0)*W0+(x|0),gx=(H[i+1]-H[i-1])/2,gy=(H[i+W0]-H[i-W0])/2,m=M[i]/255;
 if(crash<=0){const air=jz>.05,gk=air?0:(B?.3:1);vx-=gx*15.7*gk*dt;vy-=gy*15.7*gk*dt;
  const dx=Math.cos(a),dy=Math.sin(a),al=vx*dx+vy*dy,sx=vx-al*dx,sy=vy-al*dy,k=Math.exp(-(air?.4:(B?2.2:RIGS[rig].grip))*dt);
  slip=Math.hypot(sx,sy);
  vx=dx*al+sx*k;vy=dy*al+sy*k;
  const f=Math.max(0,1-(.0035*s+.02+(air?0:(1-m)*.18))*dt);vx*=f;vy*=f;
  if(B&&!air){const sn=Math.hypot(vx,vy);if(sn>0){const ns=Math.max(0,sn-16*dt);vx*=ns/sn;vy*=ns/sn}}}
 x+=vx*dt;y+=vy*dt;jumpStep(dt);railCheck();
 if(x<6){x=6;vx=0}if(x>W0-6){x=W0-6;vx=0}if(y<6){y=6;vy=0}
 if(crash<=0&&jz<1.5){const gx0=(x/6)|0,gy0=(y/6)|0;
  for(let u=-1;u<=1;u++)for(let v=-1;v<=1;v++){const T=trees.get((gx0+u)*10000+gy0+v);
   if(T&&Math.hypot(T.x-x,T.y-y)<2.4&&s>1){crash=1.1;crashes++;x-=vx*.12;y-=vy*.12;vx=vy=0}}}
 if(crash<=0&&jz<=.05){
  // deeper track in the snow, and spray when carving hard or braking
  const dk=(B||slip>3)?.8:.9,o=((y|0)*W0+(x|0))*4;
  for(const q of TQ){col[o+q]*=dk;col[o+q+1]*=dk+.02;col[o+q+2]*=Math.min(1,dk+.07)}
  const sn=Math.hypot(vx,vy);
  if(B&&sn>3)emit(1,x,y,.15,2.2,1.6,-vx*.15,-vy*.15);
  else if(slip>4)emit(1,x,y,.15,2.2,1.4,0,0)}
 if(y>FIN){state='done';msg.hidden=false;msgT.textContent='Finished in '+time.toFixed(1)+' s with '+score+' points and '+crashes+' crash'+(crashes==1?'':'es')+'.';go.textContent='Ride again';go.hidden=false}
}

// ---- input: hold the left or right half of the screen to turn (or spin in the air); both halves together jump; swipe down to brake ----
const ptrs=new Map(),kb={L:0,R:0,B:0},SWIPE=36;
function applyInput(){let l=kb.L,r=kb.R,b=kb.B;
 for(const p of ptrs.values()){if(p.side<0)l=1;else r=1;if(p.brake)b=1}
 if(l&&r&&!both)JU=1; // both sides pressed together = jump
 both=!!(l&&r);L=l;R=r;B=b;gl.classList.toggle('on',!!l);gr.classList.toggle('on',!!r)}
function sideOf(px){return px<cv.clientWidth/2?-1:1}
function pDown(id,px,py){ptrs.set(id,{y0:py,side:sideOf(px),brake:false});applyInput()}
function pMove(id,px,py){const p=ptrs.get(id);if(!p)return;const dy=py-p.y0;
 p.brake=dy>SWIPE;p.side=sideOf(px);applyInput()}
function pUp(id){ptrs.delete(id);applyInput()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}pDown(e.pointerId,e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>pMove(e.pointerId,e.clientX,e.clientY));
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>pUp(e.pointerId)));
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')kb.L=1;if(k=='ArrowRight'||k=='d')kb.R=1;if(k=='ArrowDown'||k=='s')kb.B=1;if(k==' '||k=='ArrowUp'||k=='w')JU=1;applyInput()});
addEventListener('keyup',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')kb.L=0;if(k=='ArrowRight'||k=='d')kb.R=0;if(k=='ArrowDown'||k=='s')kb.B=0;applyInput()});
go.addEventListener('click',start);
// ---- equipment picker in the menu (remembered between visits where the browser allows it) ----
function setRig(r){rig=r;pb.classList.toggle('on',r==='board');ps.classList.toggle('on',r==='ski');
 pb.setAttribute('aria-pressed',r==='board');ps.setAttribute('aria-pressed',r==='ski');
 try{localStorage.setItem('gresca-rig',r)}catch(_){}}
pb.addEventListener('click',()=>setRig('board'));ps.addEventListener('click',()=>setRig('ski'));
try{const s=localStorage.getItem('gresca-rig')||localStorage.getItem('gv-rig');if(s==='ski'||s==='board')setRig(s)}catch(_){}

// ---- rendering: behind-the-rider view ----
const lo=document.createElement('canvas'),lx=lo.getContext('2d'),occ=new Int16Array(400*NS);
// Screen position of a world point (wx,wy) at height h, in canvas pixels. null if behind or off to the side.
function project(wx,wy,h){const ox=wx-cam.px,oy=wy-cam.py,f=ox*cam.dx+oy*cam.dy;if(f<3)return null;
 const r=-ox*cam.dy+oy*cam.dx,p=Math.atan2(r,f);if(Math.abs(p)>FOV/2+.08)return null;
 return{X:(.5+p/FOV)*cam.RW*cam.kx,Y:((camH-h)/f*cam.sc+cam.hz-cam.pt)*cam.kx,s:cam.sc/f*cam.kx,f,z:Math.hypot(f,r)}}

let flagsDrawn=0;
// Orange flags on both sides of every kicker lip, and a flag at the start of each rail, so features can be spotted from far up the slope.
function pole(wx,wy,hgt,color){const gh=H[(wy|0)*W0+(wx|0)],A=project(wx,wy,gh),T=project(wx,wy,gh+hgt);if(!A||!T)return;
 ctx.strokeStyle='#3a3f58';ctx.lineWidth=Math.max(1,A.s*.08);ctx.beginPath();ctx.moveTo(A.X,A.Y);ctx.lineTo(T.X,T.Y);ctx.stroke();
 const fw=Math.max(5,A.s*.9),fh=Math.max(4,A.s*.55);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(T.X,T.Y);ctx.lineTo(T.X+fw,T.Y+fh*.5);ctx.lineTo(T.X,T.Y+fh);ctx.closePath();ctx.fill();flagsDrawn++}
function drawFlags(){flagsDrawn=0;
 for(const k of KICK){if(k+5<cam.py||k-11>cam.py+260)continue;const big=KBIG.has(k),c=cx(k),h=big?3.2:2.4;
  pole(c-11,k,h,'#ff6b3d');pole(c+11,k,h,'#ff6b3d');if(big){pole(c-11,k-8,h,'#ffd23d');pole(c+11,k-8,h,'#ffd23d')}}
 for(const r of RAILS){if(r.y1<cam.py||r.y0>cam.py+260)continue;pole(r.x0+(r.x0>cx(r.y0)?3:-3),r.y0,1.8,r.t==='box'?'#6fcfa0':'#c9372c')}}

let railsDrawn=0;
// Rails are red bars on posts, boxes are wider mint-green bars. Drawn as short segments so the near end can run off screen.
function drawRails(){
 let n=0;
 for(const r of RAILS){
  if(r.y1<cam.py-5||r.y0>cam.py+260)continue;
  let prev=null;
  for(let t=0;t<=r.len+.01;t+=1.5){const tt=Math.min(t,r.len),wx=r.x0+r.dx*tt,wy=r.y0+r.dy*tt,gh=H[(wy|0)*W0+(wx|0)],P=project(wx,wy,gh+r.h);
   if(P&&prev){ctx.strokeStyle=r.t==='box'?'#6fcfa0':'#c9372c';ctx.lineWidth=Math.max(r.t==='box'?5:3,P.s*(r.t==='box'?1.3:.5));ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(prev.X,prev.Y);ctx.lineTo(P.X,P.Y);ctx.stroke();n++}
   if(P&&t%6<1.5){const G=project(wx,wy,gh);if(G){ctx.strokeStyle='#3a3f58';ctx.lineWidth=Math.max(1,P.s*.12);ctx.beginPath();ctx.moveTo(P.X,P.Y);ctx.lineTo(G.X,G.Y);ctx.stroke()}}
   prev=P}
 }
 railsDrawn=n}

function drawRider(c,m,dA,lean,tuck,face,ski){
 // snowboarder seen from behind and above: board, legs, yellow jacket, helmet
 const bl=(ski?1.9:1.7)*m,bx=Math.sin(dA)*bl,by=-Math.cos(dA)*bl*.4,lo_=lean*.25*m,hip=-.7*m*(1-.15*tuck),sh=-1.25*m*(1-.12*tuck);
 c.lineCap='round';
 // a snowboard is one board; skis are two, side by side
 const so=ski?.3*m*Math.cos(dA):0,sy=ski?.12*m*Math.sin(dA):0;
 for(const sg of ski?[-1,1]:[0]){const ox=sg*so,oy=sg*sy;
  c.strokeStyle=ski?'#3a3f58':'#2a2f45';c.lineWidth=(ski?.12:.2)*m;c.beginPath();c.moveTo(-bx/2+ox,-by/2+oy);c.lineTo(bx/2+ox,by/2+oy);c.stroke();
  c.strokeStyle='#e9503c';c.lineWidth=(ski?.04:.07)*m;c.beginPath();c.moveTo(-bx/2+ox,-by/2+oy);c.lineTo(bx/2+ox,by/2+oy);c.stroke()}
 c.save();c.scale(.5+.5*Math.abs(Math.cos(face)),1); // body narrows as the rider turns side-on
 c.strokeStyle='#2b3550';c.lineWidth=.22*m;
 for(const sg of ski?[-1,1]:[0]){const fx=ski?sg*so:-bx*.22,fy=ski?sg*sy:-by*.22;c.beginPath();c.moveTo(fx,fy);c.lineTo(lo_*.5,hip);c.stroke()}
 if(!ski){c.beginPath();c.moveTo(bx*.22,by*.22);c.lineTo(lo_*.5,hip);c.stroke()}
 c.strokeStyle='#f2c230';c.lineWidth=.55*m;c.beginPath();c.moveTo(lo_*.5,hip);c.lineTo(lo_,sh);c.stroke();
 c.strokeStyle='#d9a91f';c.lineWidth=.16*m;
 c.beginPath();c.moveTo(lo_-.28*m,sh+.1*m);c.lineTo(lo_-.62*m,sh+.55*m+tuck*.1*m);c.stroke();
 c.beginPath();c.moveTo(lo_+.28*m,sh+.1*m);c.lineTo(lo_+.62*m,sh+.55*m+tuck*.1*m);c.stroke();
 if(ski){c.strokeStyle='#8a90a8';c.lineWidth=.05*m;for(const sg of[-1,1]){c.beginPath();c.moveTo(lo_+sg*.62*m,sh+.55*m+tuck*.1*m);c.lineTo(lo_+sg*.8*m,sh+1.4*m);c.stroke()}}
 c.fillStyle='#e9503c';c.beginPath();c.arc(lo_*1.1,sh-.28*m,.26*m,0,7);c.fill();
 c.fillStyle='#2b3550';c.fillRect(lo_*1.1-.2*m,sh-.34*m,.4*m,.1*m);
 c.restore();
}

function draw(dt){
 const RW=Math.min(360,Math.round(cv.clientWidth/1.6)),RH=Math.round(RW*Hh/W);
 if(lo.width!==RW||lo.height!==RH){lo.width=RW;lo.height=RH}
 // The camera follows the direction of travel, not the nose: when riding switch it still looks down the
 // slope, and it ignores the board while it spins in the air.
 const back=vx*Math.cos(a)+vy*Math.sin(a)<-1.5,tgt=jz>.05?(Math.hypot(vx,vy)>1.5?Math.atan2(vy,vx):camA):(back?a+Math.PI:a),
 dT=Math.atan2(Math.sin(tgt-camA),Math.cos(tgt-camA)),face=Math.atan2(Math.sin(a-camA),Math.cos(a-camA)),
 dA=Math.abs(face)>Math.PI/2?face-Math.sign(face)*Math.PI:face; // board is symmetrical, so fold to the nearer end
 camA+=dT*Math.min(1,dt*3.2);
 const dx=Math.cos(camA),dy=Math.sin(camA),px=x-dx*CAMBACK,py=y-dy*CAMBACK,gR=H[(y|0)*W0+(x|0)];
 const pi=Math.max(0,Math.min(W0-1,px|0))+Math.max(0,Math.min(H0-1,py|0))*W0;
 const ax=Math.max(1,Math.min(W0-2,(x+dx*20)|0)),ay=Math.max(1,Math.min(H0-2,(y+dy*20)|0));
 cam.s+=(Math.max(-.3,Math.min(.8,(gR-H[ay*W0+ax])/20))-cam.s)*Math.min(1,dt*3);
 camH+=(Math.max(gR+CAMH+cam.s*CAMBACK+jz*.5,H[pi]+2.5)-camH)*Math.min(1,dt*6);
 const hz=RH*HZ,sc=RH*.75,kx=W/RW,im=lx.createImageData(RW,RH),D=im.data;
 cam.px=px;cam.py=py;cam.dx=dx;cam.dy=dy;cam.RW=RW;cam.RH=RH;cam.kx=kx;cam.sc=sc;cam.hz=hz;cam.pt=sc*cam.s;
 for(let c=0;c<RW;c++){
  const ph=(c/RW-.5)*FOV,cs=Math.cos(ph),rx=Math.cos(camA+ph),ry=Math.sin(camA+ph);
  let ym=RH,z=3;
  for(let k=0;k<NS;k++){
   const xx=px+rx*z,yy=py+ry*z;occ[c*NS+k]=ym;
   if(xx>=1&&xx<W0-2&&yy>=1&&yy<H0-2){
    const ix=xx|0,iy=yy|0,fx=xx-ix,fy=yy-iy,mi=iy*W0+ix,
    h=H[mi]*(1-fx)*(1-fy)+H[mi+1]*fx*(1-fy)+H[mi+W0]*(1-fx)*fy+H[mi+W0+1]*fx*fy,
    ys=Math.floor((camH-h)/(z*cs)*sc+hz-cam.pt);
    if(ys<ym){const o4=mi*4,f=Math.min(.85,Math.pow(z/430,1.6));let c0=col[o4],c1=col[o4+1],c2=col[o4+2];
     if(z<80){const o1=o4+W0*4,w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
      c0=c0*w00+col[o4+4]*w10+col[o1]*w01+col[o1+4]*w11;c1=c1*w00+col[o4+5]*w10+col[o1+1]*w01+col[o1+5]*w11;c2=c2*w00+col[o4+6]*w10+col[o1+2]*w01+col[o1+6]*w11}
     const r=c0+(FOG[0]-c0)*f,g=c1+(FOG[1]-c1)*f,b=c2+(FOG[2]-c2)*f;
     for(let q=Math.max(0,ys);q<ym;q++){const o=(q*RW+c)*4;D[o]=r;D[o+1]=g;D[o+2]=b;D[o+3]=255}
     ym=Math.max(0,ys)}}
   z+=1+z*.012}
 }
 lx.putImageData(im,0,0);
 const sg=ctx.createLinearGradient(0,0,0,Hh*.3);sg.addColorStop(0,'#9ea8c2');sg.addColorStop(1,'rgb('+FOG.join(',')+')');ctx.fillStyle=sg;ctx.fillRect(0,0,W,Hh);
 ctx.imageSmoothingEnabled=true;ctx.drawImage(lo,0,0,W,Hh);
 // trees, far to near, hidden when a nearer ridge covers them
 const vis=[];
 for(const T of treeArr){const P=project(T.x,T.y,H[(T.y|0)*W0+(T.x|0)]);if(!P||P.f>300)continue;vis.push({P})}
 vis.sort((u,v)=>v.P.f-u.P.f);
 for(const {P} of vis){
  const ci=Math.min(RW-1,Math.max(0,(P.X/kx)|0)),k=Math.max(0,Math.min(NS-1,Math.floor(Math.log((P.z+83.33)/86.33)/Math.log(1.012)))),
  ysb=P.Y/kx,hs=9/P.f*sc;
  if(occ[ci*NS+k]<ysb-hs*.6)continue;
  const fg=Math.min(.85,Math.pow(P.z/430,1.6)),X=P.X,Y=P.Y,hh=hs*kx;
  ctx.fillStyle=`rgb(${(31+(FOG[0]-31)*fg)|0},${(74+(FOG[1]-74)*fg)|0},${(58+(FOG[2]-58)*fg)|0})`;
  for(let j=0;j<3;j++){const by=Y-hh*(.12+.27*j),w=hh*(.34-.07*j);ctx.beginPath();ctx.moveTo(X-w,by);ctx.lineTo(X+w,by);ctx.lineTo(X,by-hh*.42);ctx.fill()}
 }
 drawRails();drawFlags();
 // snow spray
 for(const p of parts){const P=project(p.x,p.y,H[(p.y|0)*W0+(p.x|0)]+p.z);if(!P)continue;
  const k=p.t/p.life;ctx.fillStyle='rgba(246,248,255,'+(.8*(1-k)).toFixed(2)+')';ctx.beginPath();ctx.arc(P.X,P.Y,Math.max(1,P.s*(.2+.5*k)),0,7);ctx.fill()}
 // rider: small, in the lower third
 const mf=sc/CAMBACK*kx,m=mf*RSC,lean=Math.max(-.6,Math.min(.6,dA));
 ctx.save();ctx.translate(W/2,((camH-gR)/CAMBACK*sc+hz-cam.pt)*kx);
 ctx.fillStyle='rgba(96,86,150,.3)';ctx.beginPath();ctx.ellipse(0,0,.8*m,.25*m,0,0,7);ctx.fill();
 ctx.translate(0,-jz*mf);
 if(crash>0){ctx.translate(0,-.9*m);ctx.rotate(spin);ctx.translate(0,.9*m)}
 drawRider(ctx,m,dA,lean,jz>.05?1:0,face,rig==='ski');
 ctx.restore();
 // compact HUD
 const sp=Math.hypot(vx,vy);
 scoreEl.textContent=score;
 info.textContent=Math.round(sp*3.6)+' km/h · '+Math.max(0,Math.round(FIN-y))+' m to go';
 pop.textContent=popTxt;pop.style.opacity=Math.min(1,popT*2);
 dot.style.left=x/W0*42+'px';dot.style.top=y/H0*103+'px'}

let last=0;
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
 if(state==='run'){step(dt/2);step(dt/2);stepParts(dt);popT=Math.max(0,popT-dt)}
 if(state!=='load')draw(dt);requestAnimationFrame(loop)}
setTimeout(()=>{build();state='ready';x=cx(60);y=60;vx=vy=0;a=1.57;crash=0;crashes=0;time=0;spin=0;camA=1.57;camH=H[60*W0+(x|0)]+CAMH;
 msgT.textContent='Ride from the Encampadors ridge down to Pas de la Casa. Hold the left or right side of the screen to turn. Press both sides together to jump, then tap left or right in the air to spin. Swipe down to brake. Avoid the trees.';go.hidden=false},60);
requestAnimationFrame(loop);
</script></body></html>
