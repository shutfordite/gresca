<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gresca</title>
<style>
:root{--bg:#0e1a2b;--ink:#f3f5fb;--acc:#f2b52a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
body{position:relative}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;font-size:13px;line-height:1.2;text-shadow:0 1px 4px rgba(30,34,64,.7);pointer-events:none}
.hud b{display:block;font-size:26px;letter-spacing:.5px}
#pop{position:absolute;left:60%;top:56%;font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 5px rgba(30,34,64,.8);opacity:0;pointer-events:none}
#mini{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:42px;height:103px;border-radius:6px;border:2px solid rgba(255,255,255,.35);overflow:hidden;opacity:.8;pointer-events:none}
#mini canvas{width:100%;height:100%;display:block}
#dot{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);border:1px solid #fff}
.glove{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:18px;width:46px;height:54px;color:#fff;opacity:.3;pointer-events:none;transition:opacity .08s}
.glove.r{left:auto;right:18px;transform:scaleX(-1)}
.glove.on{opacity:.85}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(24,30,58,.78);padding:20px;text-align:center}
#msg div{max-width:340px}
h1{margin:0 0 6px;font-size:34px;letter-spacing:.5px}
p{margin:6px 0;line-height:1.4;font-size:15px}
small{opacity:.7;font-size:12px}
#go{margin-top:12px;padding:13px 28px;border:0;border-radius:12px;background:var(--acc);color:#1b2038;font:700 17px "Trebuchet MS",system-ui,sans-serif}
.pick{display:flex;margin:14px auto 0;max-width:260px}
.pick button{flex:1;padding:11px 0;border:2px solid var(--acc);background:transparent;color:var(--ink);font:700 15px "Trebuchet MS",system-ui,sans-serif}
.pick button:first-child{border-radius:12px 0 0 12px}
.pick button:last-child{border-radius:0 12px 12px 0;border-left:0}
.pick button.on{background:var(--acc);color:#1b2038}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><b id="score">0</b><span id="info">0 km/h</span></div>
<div id="pop"></div>
<div id="mini"><canvas id="mc" width="42" height="103"></canvas><div id="dot"></div></div>
<svg class="glove" id="gl" viewBox="0 0 40 48" aria-hidden="true"><path fill="currentColor" d="M8 46V24L4 15c-1-3 2-5 4-3l4 5V5c0-3 5-3 5 0v12V3c0-3 5-3 5 0v14V7c0-3 5-3 5 0v20c0 9-2 14-5 19z"/></svg>
<svg class="glove r" id="gr" viewBox="0 0 40 48" aria-hidden="true"><path fill="currentColor" d="M8 46V24L4 15c-1-3 2-5 4-3l4 5V5c0-3 5-3 5 0v12V3c0-3 5-3 5 0v14V7c0-3 5-3 5 0v20c0 9-2 14-5 19z"/></svg>
<div id="msg"><div><h1>Gresca</h1><p id="t">Building the mountain...</p><div class="pick" role="group" aria-label="Equipment"><button id="pb" class="on" aria-pressed="true">Snowboard</button><button id="ps" aria-pressed="false">Skis</button></div><button id="go" hidden>Drop in</button><p><small>Stylized terrain inspired by the Encampadors to Pas de la Casa run. Real elevation data comes next.</small></p></div></div>
<script src="art/gresca-hanga-spec.js"></script>
<script src="art/gresca-rider-anim.js"></script>
<script src="src/config.js"></script>
<script src="src/terrain.js"></script>
<script src="src/world.js"></script>
<script src="src/dom.js"></script>
<script src="src/camera.js"></script>
<script src="src/build.js"></script>
<script src="src/sim.js"></script>
<script src="src/park.js"></script>
<script src="src/step.js"></script>
<script src="src/input.js"></script>
<script src="src/menu.js"></script>
<script src="src/sprites.js"></script>
<script src="src/rider-view.js"></script>
<script src="src/draw.js"></script>
<script src="src/app.js"></script>
<script src="src/debug.js"></script>
</body></html>
